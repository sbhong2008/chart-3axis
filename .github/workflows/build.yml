name: build-and-deploy
on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST 평일 — 국내 장 마감 후
    - cron: "30 21 * * 1-5"  # 06:30 KST 화~토 — 미국 장 마감 후
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "build.py", "indicators.py", "elliott.py", ".github/workflows/build.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python3 build.py --out site   # 데이터는 커밋하지 않고 배포물로만 올림
        env:   # 국내 공매도(KRX 로그인)용 — Secrets 가 없으면 국내 공매도만 건너뜀
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
